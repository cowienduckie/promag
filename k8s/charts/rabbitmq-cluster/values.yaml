namespace: dev

rabbitmq:
  image:
    repository: rabbitmq
    tag: 4.1.3-management

  replicas: 1

  persistence:
    enabled: true
    # existingClaim: rabbitmq-pvc
    storageClassName: standard
    storage: 1Gi
    
  auth:
    username: promag
    password: secure-password

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  additionalConfig: |-
    loopback_users.guest = false

  service:
    type: ClusterIP